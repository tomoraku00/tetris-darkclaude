<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a2e; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Courier New', monospace; color: #fff; }
        .container { display: flex; gap: 30px; padding: 20px; }
        #gameCanvas { border: 3px solid #4a4aff; box-shadow: 0 0 30px rgba(74,74,255,0.5); }
        .sidebar { display: flex; flex-direction: column; gap: 20px; }
        .panel { background: #1a1a3e; border: 2px solid #4a4aff; border-radius: 8px; padding: 15px; min-width: 150px; }
        .panel h2 { font-size: 14px; color: #6a6aff; margin-bottom: 10px; text-transform: uppercase; }
        .panel .value { font-size: 28px; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.5); }
        #nextCanvas { display: block; margin: 0 auto; image-rendering: pixelated; }
        .controls { font-size: 12px; color: #888; line-height: 1.8; }
        .controls span { color: #6a6aff; font-weight: bold; }
        .game-over { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(10,10,46,0.95); border: 3px solid #ff4a4a; padding: 40px; text-align: center; z-index: 100; }
        .game-over h1 { color: #ff4a4a; font-size: 36px; margin-bottom: 20px; }
        .game-over p { font-size: 24px; margin-bottom: 30px; }
        .game-over button { background: #4a4aff; color: #fff; border: none; padding: 15px 40px; font-size: 18px; font-family: 'Courier New', monospace; cursor: pointer; border-radius: 5px; }
        .game-over button:hover { background: #6a6aff; }
    </style>
</head>
<body>
    <div class="container">
        <canvas id="gameCanvas" width="240" height="480"></canvas>
        <div class="sidebar">
            <div class="panel"><h2>Score</h2><div class="value" id="score">0</div></div>
            <div class="panel"><h2>Level</h2><div class="value" id="level">1</div></div>
            <div class="panel"><h2>Lines</h2><div class="value" id="lines">0</div></div>
            <div class="panel"><h2>Next</h2><canvas id="nextCanvas" width="80" height="80"></canvas></div>
            <div class="panel controls">
                &larr;&rarr; &#x79FB;&#x52D5;<br>&uarr; &#x6539;&#x7FD2;<br>&darr; &#x9AD8;&#x901F;&#x843D;&#x4E0B;<br>Space: Hard Drop<br>P: Pause
            </div>
        </div>
    </div>
    <div class="game-over" id="gameOver">
        <h1>GAME OVER</h1>
        <p>Score: <span id="finalScore">0</span></p>
        <button id="restartBtn">RESTART</button>
    </div>
    <script src="tetris.js"></script>
</body>
</html>

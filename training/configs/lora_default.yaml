model:
  name: unsloth/Qwen3-4B
  load_in_4bit: true
  max_seq_length: 1024

lora:
  r: 16
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  lora_alpha: 16
  lora_dropout: 0
  bias: none

training:
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  num_train_epochs: 2
  learning_rate: 2.0e-4
  warmup_steps: 5
  logging_steps: 1
  save_steps: 50
  output_dir: output
  optim: adamw_8bit
